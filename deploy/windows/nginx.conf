# Copy to C:/Server/nginx-1.30.6/conf/nginx.conf.
# If the project directory changes, update the root path below.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 25m;

    server {
        listen 8084;
        server_name localhost;

        root  D:/Project/hotel-bome/public;
        index index.php;

        access_log logs/hotel-bome-access.log;
        error_log  logs/hotel-bome-error.log warn;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location ~ \.php$ {
            try_files $uri =404;

            include       fastcgi_params;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            fastcgi_param HTTP_PROXY      "";

            fastcgi_hide_header X-Powered-By;
        }
    }
}
